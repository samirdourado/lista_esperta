name: lista-esperta

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lista}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lista}
      POSTGRES_DB: ${POSTGRES_DB:-lista_esperta}
    ports:
      # 5432 on the host is taken by a local PostgreSQL install.
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/db/init/01-test-database.sh:/docker-entrypoint-initdb.d/20-test-database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./back_lista_esperta
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    # JWT secrets and API keys come from here (see back_lista_esperta/.env.example).
    env_file:
      - path: ./back_lista_esperta/.env
        required: true
    environment:
      PORT: 3333
      DATABASE_URL: postgresql://${POSTGRES_USER:-lista}:${POSTGRES_PASSWORD:-lista}@db:5432/${POSTGRES_DB:-lista_esperta}?schema=public
      FRONTEND_URL: http://localhost:3000
      # Hot reload over the Windows bind mount.
      CHOKIDAR_USEPOLLING: "true"
      TSC_WATCHFILE: DynamicPriorityPolling
    ports:
      - "3333:3333"
    volumes:
      - ./back_lista_esperta:/app
      - /app/node_modules
      - ./back_lista_esperta/uploads:/app/uploads

  web:
    build:
      context: ./front_lista_esperta
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    env_file:
      - path: ./front_lista_esperta/.env.local
        required: false
    environment:
      # The browser calls the API through the host port.
      NEXT_PUBLIC_API_URL: http://localhost:3333/api/v1
      # Server-side calls (proxy.ts) reach the API inside the Docker network.
      API_INTERNAL_URL: http://api:3333/api/v1
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./front_lista_esperta:/app
      - /app/node_modules
      - /app/.next

volumes:
  db_data:
